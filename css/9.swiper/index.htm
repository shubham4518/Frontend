<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Swiper demo</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1"
    />

    <style>
      html,
      body {
        position: relative;
        height: 100%;
      }

      body {
        background: #000;
        font-family:
          Helvetica Neue,
          Helvetica,
          Arial,
          sans-serif;
        font-size: 14px;
        color: #fff;
        margin: 0;
        padding: 0;
      }

      swiper-container {
        width: 80%;
        height: 700px;
      }

      swiper-slide {
        text-align: center;
        font-size: 18px;
        background: #444;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      swiper-slide img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
  </head>

  <body>
    <swiper-container
      class="mySwiper"
      pagination="true"
      pagination-type="progressbar"
      navigation="true"
    >
      <swiper-slide>
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTTd2K_seMehcO5DMHeGe83HgY9FSpPecTPgoWSB0clfBwfgllwnBR68xwa&s=10"
          height="100vh"
          width="100%"
          alt="no issue"
        />
      </swiper-slide>
      <swiper-slide><img src="https://resizing.flixster.com/-XZAfHZM39UwaGJIFWKAE8fS0ak=/v3/t/assets/p14612810_p_v10_aa.jpg" alt=""></swiper-slide>
      <swiper-slide><img src="https://assets-in.bmscdn.com/iedb/movies/images/mobile/listing/medium/toxic-a-fairy-tale-for-grown-ups-et00379311-1771578905.jpg" alt=""></swiper-slide>
      <swiper-slide><img src="https://static.toiimg.com/thumb/msid-133215929,imgsize-1049979,width-400,resizemode-4/salaar-2-update-prabhas-and-prashanth-neels-team-begin-pre-production-for-shouryaanga-parvam-report.jpg" alt=""></swiper-slide>
      <swiper-slide>Slide 5</swiper-slide>
      <swiper-slide>Slide 6</swiper-slide>
      <swiper-slide>Slide 7</swiper-slide>
      <swiper-slide>Slide 8</swiper-slide>
      <swiper-slide>Slide 9</swiper-slide>
    </swiper-container>

    <script src="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-element-bundle.min.js"></script>
  </body>
</html>
